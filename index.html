<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>滑梯棋</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup-screen">
        <!-- Step 1: Player Count -->
        <div id="step1-player-count">
            <h1>滑梯棋</h1>
            <div class="step-content">
                <p class="step-label">選擇玩家數量：</p>
                <div id="player-count-buttons">
                    <button class="count-btn" data-count="2">2</button>
                    <button class="count-btn selected" data-count="3">3</button>
                    <button class="count-btn" data-count="4">4</button>
                </div>
            </div>
            <button id="next-step-btn">下一步</button>
        </div>

        <!-- Step 2: Player Settings -->
        <div id="step2-player-settings" class="hidden">
            <h1>滑梯棋</h1>
            <div id="player-cards"></div>
            <div class="step2-buttons">
                <button id="back-btn">返回</button>
                <button id="start-btn">開始遊戲</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
        <button id="pause-btn">⏸</button>
        <div id="game-layout">
            <div id="board-container">
                <canvas id="board-canvas"></canvas>
            </div>
            <div id="side-panel">
                <div id="info-panel">
                    <div id="current-turn"></div>
                    <div id="player-positions"></div>
                </div>
                <div id="spinner-container">
                    <canvas id="spinner-canvas"></canvas>
                    <div id="spin-hint">點擊轉盤</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pause Screen Overlay -->
    <div id="pause-screen" class="hidden">
        <div id="pause-content">
            <h2>遊戲暫停</h2>
            <div class="pause-buttons">
                <button id="resume-btn">繼續遊玩</button>
                <button id="pause-restart-btn">重新開始</button>
                <button id="end-game-btn">結束遊戲</button>
            </div>
        </div>
    </div>

    <!-- Win Screen Overlay -->
    <div id="win-screen" class="hidden">
        <div id="win-content">
            <h2 id="win-message"></h2>
            <button id="restart-btn">再玩一次</button>
        </div>
    </div>

    <!-- Version -->
    <div id="version">v1.2.0</div>

    <script src="js/board.js"></script>
    <script src="js/player.js"></script>
    <script src="js/spinner.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
