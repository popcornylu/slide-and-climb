<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑梯棋 - Dev Tools</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: #16213e;
            border-radius: 16px;
            padding: 32px;
            border: 2px solid #4ECDC4;
        }
        h1 { color: #FFEAA7; font-size: 1.5rem; margin: 0 0 24px; }
        .row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        select {
            padding: 10px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid #4ECDC4;
            background: #1a1a2e;
            color: #eee;
            min-width: 160px;
        }
        button {
            padding: 10px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4ECDC4, #45B7D1);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { transform: scale(0.95); }
        .status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Sound Tester</h1>
        <div class="row">
            <select id="sound-select">
                <option value="spinnerTick">tick (轉盤噠噠)</option>
                <option value="spinnerResult">result (轉盤結果)</option>
                <option value="step">step (前進)</option>
                <option value="ladderClimb">ladder (爬梯)</option>
                <option value="snakeSlide">snake (滑蛇)</option>
                <option value="win">win (勝利)</option>
            </select>
            <button id="play-btn">Play</button>
        </div>
        <div class="status" id="status"></div>
    </div>

    <script src="js/sound.js"></script>
    <script>
        const playBtn = document.getElementById('play-btn');
        const select = document.getElementById('sound-select');
        const status = document.getElementById('status');

        playBtn.addEventListener('click', () => {
            Sound.resume();
            const fn = Sound[select.value];
            if (fn) {
                fn();
                status.textContent = `Playing: ${select.value}`;
            }
        });
    </script>
</body>
</html>
